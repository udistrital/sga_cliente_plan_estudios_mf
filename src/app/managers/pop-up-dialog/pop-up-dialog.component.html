<div class="popup-container">

  <div class="popup-icon" [ngClass]="'icon-' + data.type">
    <mat-icon>{{ icon }}</mat-icon>
  </div>

  <h2 mat-dialog-title>
    {{ data.title }}
  </h2>

  <mat-dialog-content>
    <div class="popup-message" [innerHTML]="data.text"></div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">

    <button
      *ngIf="data.cancelar"
      mat-stroked-button
      type="button"
      (click)="cancelar()">
      {{ data.cancelarTexto }}
    </button>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="confirmar()">
      {{ data.aceptarTexto }}
    </button>

  </mat-dialog-actions>

</div>
